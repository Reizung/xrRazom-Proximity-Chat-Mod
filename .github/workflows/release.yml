name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build xrRazom_VOIP_Telemetry.zip & release notes
        run: |
          python3 - <<'PYEOF'
          import os, textwrap, zipfile

          include_items = [
              "gamedata",
              "meta.ini",
              "voip_client",
              "Install_Mod_in_GAMMA.sh",
              "README.md",
              "LICENSE",
          ]
          skip_dirs = {"__pycache__", ".venv", "venv", "env", ".git", ".github"}
          skip_exts = (".pyc", ".pyo", ".tmp", ".zip", ".rar", ".7z", ".log", ".swp")
          skip_files = {"voip_config.json", "voip_telemetry.json", ".DS_Store", "Thumbs.db", "desktop.ini"}

          with zipfile.ZipFile("xrRazom_VOIP_Telemetry.zip", "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for item in include_items:
                  if os.path.isfile(item):
                      zf.write(item, f"xrRazom_VOIP_Telemetry/{item}")
                  elif os.path.isdir(item):
                      for root, dirs, files in os.walk(item):
                          dirs[:] = sorted(d for d in dirs if d not in skip_dirs)
                          for fn in sorted(files):
                              if fn in skip_files or fn.endswith(skip_exts):
                                  continue
                              full = os.path.join(root, fn)
                              zf.write(full, f"xrRazom_VOIP_Telemetry/{full}")

          notes = textwrap.dedent("""\
              Ready-to-install archive containing both the in-game telemetry mod (`gamedata/` + `meta.ini`) and the companion VOIP app (`voip_client/`).

              ### Quick Start
              1. **Install the mod:** Install `xrRazom_VOIP_Telemetry.zip` directly in **Mod Organizer 2** (*Install a new mod from an archive*) and enable it below `xrRazom Co-op` (or extract `gamedata/` into `Anomaly/gamedata/`).
              2. **Run the VOIP client:** Extract `voip_client/` to a separate folder and run `./Start_VOIP_Linux.sh` (Linux) or `Start_VOIP_Windows.bat` (Windows).
              3. **Firewall:** Allow UDP port `27016` on the Host alongside xrRazom's `27015`.

              *Note: Built for Linux and Windows; currently tested only on Linux (CachyOS).*
          """)
          with open("/tmp/release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes)

          with zipfile.ZipFile("xrRazom_VOIP_Telemetry.zip", "r") as zf:
              print("Archive entries:")
              for name in zf.namelist():
                  print(" ", name)
          PYEOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            TAG="v1.0.0"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" xrRazom_VOIP_Telemetry.zip --clobber
            gh release edit "$TAG" --title "xrRazom VOIP ${TAG}" --notes-file /tmp/release_notes.md
          else
            gh release create "$TAG" xrRazom_VOIP_Telemetry.zip --title "xrRazom VOIP ${TAG}" --notes-file /tmp/release_notes.md
          fi
